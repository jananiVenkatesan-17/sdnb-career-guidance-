<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CARE Bot</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="chat-container">

  <!-- Header -->
  <div class="chat-header">

    <!-- Left logo -->
    <img src="sdnb-logo.png" class="header-logo left-logo">

    <!-- Center title -->
    <div class="header-title">
      <div class="title-main">CARE Bot</div>
      <div class="title-sub">Career Advisory & Response Engine</div>
    </div>

    <!-- Right logo -->
    <img src="58-logo.png" class="header-logo right-logo">

  </div>

  <!-- Chat Area -->
  <div class="chat-messages" id="chatMessages"></div>

  <!-- Language Selection -->
  <div class="language-select" id="languageSelect">
    <p>Select your language</p>
    <button onclick="selectLanguage('en')">English</button>
    <button onclick="selectLanguage('ta')">தமிழ்</button>
  </div>

  <!-- Input Area -->
  <div class="chat-input" id="chatInput" style="display:none;">
    <input type="text" id="userInput" placeholder="Type your message...">
    <button onclick="sendMessage()">➤</button>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
