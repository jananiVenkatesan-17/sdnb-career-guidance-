
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SDNBVC - PLACIFY</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="chat-container">

    <div class="chat-header">
      <img src="images/sdnb-logo.png" class="header-logo" alt="SDNB Logo" />

      <div class="header-title">
        <div class="title-main">SDNBVC - PLACIFY</div>
        <div class="title-sub">PLACEMENT TRAINING</div>
      </div>

      <img src="images/58-logo.png" class="header-logo" alt="58 Logo" />
    </div>

    <div class="chat-messages" id="chatMessages">
      <div class="bot-msg">
        Hi 👋 Welcome to <strong>PLACIFY</strong>.<br><br>
        Placify is a platform developed to help students prepare for campus placements.
      </div>
    </div>

    <div class="chat-input">
      <input type="text" id="userInput" placeholder="Type your question here..." />
      <button id="sendBtn" type="button">➤</button>
    </div>

  </div>
  

  <script src="script.js"></script>
</body>
</html>
