<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SDNBVC - PLACIFY | Skill Requirements</title>

  <!-- ✅ Correct CSS file name -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="chat-container">

  <!-- HEADER -->
  <div class="chat-header">
    <!-- ✅ Correct image path -->
    <img src="images/sdnb-logo.png" class="header-logo" alt="SDNB Logo" />

    <div class="header-title">
      <div class="title-main">SDNBVC - PLACIFY</div>
      <div class="title-sub">Skill Requirements</div>
    </div>

    <!-- ✅ Correct image path -->
    <img src="images/58-logo.png" class="header-logo" alt="58 Logo" />
  </div>

  <!-- CONTENT -->
  <div class="chat-messages" id="skillMessages">

    <div class="bot-msg"><strong>SKILL REQUIREMENTS</strong></div>

    <div class="option-container">
      <button class="option-btn" onclick="selectSkill(this)">Communication Skills</button>
      <button class="option-btn" onclick="selectSkill(this)">Technical Knowledge</button>
      <button class="option-btn" onclick="selectSkill(this)">Problem Solving Ability</button>
      <button class="option-btn" onclick="selectSkill(this)">Team Work</button>
      <button class="option-btn" onclick="selectSkill(this)">Time Management</button>
    </div>

    <div style="margin-top:20px;">
      <button class="option-btn" onclick="window.location.href='placement.html'">⬅ Back</button>
    </div>

  </div>

  <!-- INPUT AREA -->
  <div class="chat-input">
    <input type="text" id="skillInput" placeholder="Type a message here..." />
    <button type="button" onclick="sendSkillMessage()">➤</button>
  </div>

</div>

<script>
  // Toggle selected style (click again to unselect)
  function selectSkill(button) {
    const isSelected = button.classList.contains("selected");
    document.querySelectorAll(".option-btn").forEach(btn => btn.classList.remove("selected"));
    if (!isSelected) button.classList.add("selected");
  }

  function sendSkillMessage() {
    const input = document.getElementById("skillInput");
    const chatMessages = document.getElementById("skillMessages");

    const message = input.value.trim();
    if (message === "") return;

    const userMsg = document.createElement("div");
    userMsg.classList.add("user-msg");
    userMsg.textContent = message;
    chatMessages.appendChild(userMsg);

    input.value = "";
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  // ✅ Enter key support (prevents page refresh)
  document.getElementById("skillInput").addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
      e.preventDefault();
      sendSkillMessage();
    }
  });
</script>

</body>
</html>
