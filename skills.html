<!DOCTYPE html>
<html>
<head>
  <title>Skill Requirements</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="chat-container">

  <!-- HEADER -->
  <div class="chat-header">
    <img src="sdnb-logo.png" class="header-logo">
    <div class="header-title">
      <div class="title-main">SDNBVC - PLACIFY</div>
      <div class="title-sub">Skill Requirements</div>
    </div>
    <img src="58-logo.png" class="header-logo">
  </div>

  <!-- CONTENT -->
  <div class="chat-messages" id="skillMessages">

    <div class="bot-msg">SKILL REQUIREMENTS</div>

    <div class="option-container">
      <button class="option-btn" onclick="selectSkill(this)">
        Communication Skills
      </button>

      <button class="option-btn" onclick="selectSkill(this)">
        Technical Knowledge
      </button>

      <button class="option-btn" onclick="selectSkill(this)">
        Problem Solving Ability
      </button>

      <button class="option-btn" onclick="selectSkill(this)">
        Team Work
      </button>

      <button class="option-btn" onclick="selectSkill(this)">
        Time Management
      </button>
    </div>

    <div style="margin-top:20px;">
      <button class="option-btn"
        onclick="window.location.href='placement.html'">
        ⬅ Back
      </button>
    </div>

  </div>

  <!-- INPUT AREA -->
  <div class="chat-input">
    <input type="text" id="skillInput" placeholder="Type a message here...">
    <button onclick="sendSkillMessage()">➤</button>
  </div>

</div>

<script>
function selectSkill(button) {
  button.style.backgroundColor = "#8b1c2d";
  button.style.color = "white";
}

function sendSkillMessage() {
  const input = document.getElementById("skillInput");
  const message = input.value.trim();
  const chatMessages = document.getElementById("skillMessages");

  if (message === "") return;

  const userMsg = document.createElement("div");
  userMsg.classList.add("user-msg");
  userMsg.textContent = message;
  chatMessages.appendChild(userMsg);

  input.value = "";
  chatMessages.scrollTop = chatMessages.scrollHeight;
}

document.getElementById("skillInput").addEventListener("keypress", function(e) {
  if (e.key === "Enter") {
    sendSkillMessage();
  }
});
</script>

</body>
</html>
