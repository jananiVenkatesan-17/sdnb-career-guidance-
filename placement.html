<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SDNBVC - PLACIFY | Placement Training</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="chat-container">

    <!-- HEADER -->
    <div class="chat-header">
      <img src="images/sdnb-logo.png" class="header-logo" alt="SDNB Logo" />

      <div class="header-title">
        <div class="title-main">SDNBVC - PLACIFY</div>
        <div class="title-sub" id="deptTitle">Placement Training</div>
      </div>

      <img src="images/58-logo.png" class="header-logo" alt="58 Logo" />
    </div>

    <!-- MESSAGES -->
    <div class="chat-messages" id="chatMessages">
      <div class="bot-msg">Loading modules...</div>
    </div>

    <!-- INPUT -->
    <div class="chat-input">
      <input type="text" id="userInput" placeholder="Type your message..." />
      <button type="button" onclick="sendMessage()">➤</button>
    </div>

  </div>

  <!-- SCRIPT -->
  <script src="script.js"></script>

</body>
</html>
