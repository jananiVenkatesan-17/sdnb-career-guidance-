<!DOCTYPE html>
<html>
<head>
  <title>Placement Training</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="chat-container">

  <!-- HEADER -->
  <div class="chat-header">
    <img src="sdnb-logo.png" class="header-logo">
    <div class="header-title">
      <div class="title-main">SDNBVC - PLACIFY</div>
      <div class="title-sub">Placement Training</div>
    </div>
    <img src="58-logo.png" class="header-logo">
  </div>

  <!-- MESSAGES -->
  <div class="chat-messages" id="chatMessages">

    <div class="bot-msg">PLACEMENT TRAINING MODULES:</div>

    <div class="option-container">
      <button class="option-btn">Aptitude Preparation</button>
      <button class="option-btn">Technical Preparation</button>
      <button class="option-btn">Interview Preparation</button>
      <button class="option-btn">Resume Building</button>
      <button class="option-btn">Mock Tests & GD</button>

      <button class="option-btn"
        onclick="window.location.href='skills.html'">
        Skill Requirements
      </button>
    </div>

    <!-- BACK BUTTON -->
    <div style="margin-top:20px;">
      <button class="option-btn"
        onclick="window.location.href='index.html'">
        ⬅ Back
      </button>
    </div>

  </div>

  <!-- INPUT -->
  <div class="chat-input">
    <input type="text" id="userInput" placeholder="Type your message...">
    <button onclick="sendMessage()">➤</button>
  </div>

</div>

<script>
function sendMessage() {
  const input = document.getElementById("userInput");
  const message = input.value.trim();
  const chatMessages = document.getElementById("chatMessages");

  if (message === "") return;

  const userMsg = document.createElement("div");
  userMsg.classList.add("user-msg");
  userMsg.textContent = message;
  chatMessages.appendChild(userMsg);

  input.value = "";
  chatMessages.scrollTop = chatMessages.scrollHeight;
}

document.getElementById("userInput").addEventListener("keypress", function(e) {
  if (e.key === "Enter") {
    sendMessage();
  }
});
</script>

</body>
</html>
