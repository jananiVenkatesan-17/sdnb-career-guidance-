<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SDNBVC PLACIFY</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="chat-container">

  <!-- Header -->
  <div class="chat-header">
    <!-- Left logo -->
    <img src="images/sdnb-logo.png" class="header-logo" alt="SDNB Logo">

    <!-- Center title -->
    <div class="header-title">
      <div class="title-main">SDNBVC - PLACIFY</div>
      <div class="title-sub">Placement Guidance Assistant</div>
    </div>

    <!-- Right logo -->
    <img src="images/58-logo.png" class="header-logo" alt="College Logo">
  </div>

  <!-- Chat Area -->
  <div class="chat-messages" id="chatMessages"></div>

  <!-- Input Area -->
  <div class="chat-input">
    <input type="text" id="userInput" placeholder="Type your message..." disabled>
    <button disabled>➤</button>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
